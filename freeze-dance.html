<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#CFEFFF">
<title>Freeze Dance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#2F3B63; --ink-soft:#5F6B95; --sky:#CFEFFF; --pink:#FF8FB8; --sun:#FFD36E; --ice:#9EDCFF; --lilac:#C9B6FF;
  --go-top:#62E29E; --go-bot:#2FBF70; --go-edge:#1F9A57;
  --font:'Fredoka','Baloo 2','Arial Rounded MT Bold','Varela Round','Comic Sans MS',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .6s ease;background:#232a48}
#cam.on{opacity:1}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
button:focus-visible{outline:5px solid var(--pink);outline-offset:5px}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vmin,28px);padding:calc(var(--st) + 3vmin) calc(var(--sr) + 4vmin) calc(var(--sb) + 3vmin) calc(var(--sl) + 4vmin);text-align:center;pointer-events:none}
.screen.active{display:flex}
.screen button{pointer-events:auto}
.title{font-weight:700;font-size:clamp(30px,8.5vmin,104px);line-height:1;color:var(--ink);text-shadow:0 .05em 0 #fff,0 -.05em 0 #fff,.05em 0 0 #fff,-.05em 0 0 #fff,.04em .04em 0 #fff,-.04em -.04em 0 #fff,.04em -.04em 0 #fff,-.04em .04em 0 #fff,0 .16em .2em rgba(47,59,99,.18)}
.emoji-row{font-size:clamp(26px,7vmin,84px);display:flex;gap:1.6vmin;line-height:1}
.emoji-row span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
.emoji-row span:nth-child(2){animation-delay:.2s}.emoji-row span:nth-child(3){animation-delay:.4s}
.emoji-row span:nth-child(4){animation-delay:.6s}.emoji-row span:nth-child(5){animation-delay:.8s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-22%)}}
.mascot-spot{flex:0 1 auto;width:min(46vmin,70vw);height:clamp(90px,30vh,380px)}
.mascot-spot.small{height:clamp(80px,24vh,300px)}
.label{font-weight:700;font-size:clamp(26px,7vmin,84px);line-height:1.05;padding:.15em .6em .2em;background:#fff;border-radius:999px;box-shadow:0 .6vmin 0 rgba(47,59,99,.12)}
.label.sm{font-size:clamp(20px,5vmin,60px)}
.note{max-width:min(720px,92vw);font-weight:500;font-size:clamp(14px,2.4vmin,22px);line-height:1.35;color:var(--ink-soft);background:rgba(255,255,255,.88);padding:.6em 1em;border-radius:18px}
.note:empty{display:none}
.row{display:flex;gap:3vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}

.big{font-weight:700;font-size:clamp(40px,10.5vmin,128px);line-height:1;color:#fff;background:linear-gradient(var(--go-top),var(--go-bot));border:clamp(5px,1.1vmin,12px) solid #fff;border-radius:999px;padding:.32em 1.05em .38em;min-height:max(16vh,84px);min-width:max(40vmin,220px);box-shadow:0 1.3vmin 0 var(--go-edge),0 2.6vmin 4vmin rgba(40,50,90,.28);text-shadow:0 .05em 0 rgba(0,0,0,.18);transition:transform .12s}
.big:active{transform:translateY(1vmin) scale(.98)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.mid{font-size:clamp(30px,7.5vmin,90px);min-width:max(30vmin,170px)}
.blue{background:linear-gradient(#8FD3FF,#4FB3F6);box-shadow:0 1.3vmin 0 #2E8FD1,0 2.6vmin 4vmin rgba(40,50,90,.28);min-width:max(18vmin,110px)}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#starbar{position:absolute;top:calc(var(--st) + 1.4vmin);left:50%;transform:translateX(-50%);display:none;gap:clamp(2px,.6vmin,8px);padding:clamp(4px,.9vmin,12px) clamp(8px,1.8vmin,22px);background:rgba(255,255,255,.85);border-radius:999px;box-shadow:0 .8vmin 2vmin rgba(47,59,99,.15)}
#hud.game #starbar{display:flex}
.slot{font-size:clamp(17px,4.2vmin,50px);line-height:1;filter:grayscale(1);opacity:.32;transition:opacity .3s,filter .3s}
.slot.on{filter:none;opacity:1;animation:starpop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes starpop{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.hbtn{pointer-events:auto;position:absolute;display:grid;place-items:center;border:none;border-radius:50%;background:#fff;box-shadow:0 .8vmin 0 rgba(47,59,99,.15),0 1.4vmin 3vmin rgba(47,59,99,.18);padding:0;line-height:1}
#btnSay{right:calc(var(--sr) + 2.6vmin);bottom:calc(var(--sb) + 2.6vmin);width:clamp(64px,15vmin,160px);height:clamp(64px,15vmin,160px);font-size:clamp(30px,8vmin,84px);border:clamp(4px,.9vmin,10px) solid var(--sun)}
#btnMute{right:calc(var(--sr) + 2vmin);top:calc(var(--st) + 1.4vmin);width:clamp(44px,8.5vmin,86px);height:clamp(44px,8.5vmin,86px);font-size:clamp(20px,4.4vmin,44px)}
#grown{pointer-events:auto;position:absolute;left:var(--sl);top:var(--st);width:clamp(56px,10vmin,96px);height:clamp(56px,10vmin,96px);display:grid;place-items:center;touch-action:none;-webkit-touch-callout:none}
#grown .lock{font-size:clamp(14px,2.6vmin,24px);opacity:.28;position:relative}
#grown .ring{position:absolute;inset:16%;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p,0) * 1turn),rgba(255,255,255,.5) 0);opacity:0;transition:opacity .2s}
#grown.holding .ring{opacity:1}
#grown.holding .lock{opacity:1}

#panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(47,59,99,.5);padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 16px);-webkit-user-select:auto;user-select:auto}
#panel.open{display:flex}
.pcard{width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:24px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(30,20,60,.35);font-size:17px}
.pcard h2{margin:0 0 4px;font-size:24px}
.pcard .sub{margin:0 0 10px;color:var(--ink-soft);font-size:14px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field>span{font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:10px 8px;border-radius:14px;border:2px solid #D6E8FF;background:#F2F8FF;font-size:16px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcard select{font:inherit;font-size:16px;padding:10px;border-radius:12px;border:2px solid #D6E8FF;background:#F8FBFF;color:var(--ink);width:100%}
.check{display:flex;gap:10px;align-items:center;margin:10px 0;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--pink)}
.pnote{font-size:14px;color:var(--ink-soft);margin:2px 0 0;line-height:1.4}
.pnote:empty{display:none}
.pactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pactions button{flex:1;min-width:120px;padding:12px;border-radius:14px;border:2px solid #D6E8FF;background:#F2F8FF;font-size:16px;font-weight:600}
.pactions .primary{background:var(--go-bot);border-color:var(--go-bot);color:#fff}
.pactions .warn{background:#FFE9F1;border-color:#FFC2D8}
@media (prefers-reduced-motion: reduce){.pulse,.emoji-row span{animation:none}}
@media (max-height:460px){.title{font-size:clamp(24px,7vmin,60px)}.emoji-row{display:none}}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<section class="screen active" data-screen="start">
  <div class="title">Freeze Dance</div>
  <div class="emoji-row" aria-hidden="true"><span>🐧</span><span>🎵</span><span>❄️</span><span>🍦</span><span>⭐</span></div>
  <div class="mascot-spot"></div>
  <button id="btnPlay" class="big pulse" aria-label="Play">▶ PLAY</button>
</section>

<section class="screen" data-screen="perm">
  <div class="mascot-spot small"></div>
  <div id="permLabel" class="label">Camera, please!</div>
  <div id="permNote" class="note"></div>
  <div id="permBtns" class="row hidden">
    <button id="btnTouch" class="big mid" aria-label="Play with touch">👆 Touch</button>
    <button id="btnRetry" class="big mid blue" aria-label="Try the camera again">🔄</button>
  </div>
</section>

<section class="screen" data-screen="rest">
  <div class="label">Great job!</div>
  <div class="mascot-spot"></div>
  <div class="label sm">Drink some water 💧</div>
  <button id="btnAgain" class="big pulse" aria-label="Play again">▶ Play again</button>
</section>

<div id="hud">
  <div id="starbar" aria-label="Stars"></div>
  <button id="btnMute" class="hbtn" aria-label="Sound on or off">🔔</button>
  <button id="btnSay" class="hbtn" aria-label="Say it again">🔊</button>
  <div id="grown" aria-label="Grown-up corner, press and hold for 3 seconds"><div class="ring"></div><span class="lock">🔒</span></div>
</div>

<div id="panel" role="dialog" aria-modal="true" aria-label="Grown-up corner">
  <div class="pcard">
    <h2>Grown-up corner</h2>
    <p class="sub">The game is paused. The camera only measures movement on this device; nothing is recorded or uploaded.</p>
    <div class="field"><span>Difficulty (how long to freeze, how still to be)</span>
      <div class="seg" id="segDiff"><button data-v="easy">Easy</button><button data-v="normal">Normal</button><button data-v="hard">Big kid</button></div>
    </div>
    <label class="field"><span>Camera</span><select id="selCam"></select></label>
    <p id="camNote" class="pnote"></p>
    <label class="field"><span>Microphone (optional: singing along makes music notes)</span><select id="selMic"></select></label>
    <p id="micNote" class="pnote"></p>
    <label class="check"><input type="checkbox" id="chkTouch"> Touch mode, no camera</label>
    <label class="check"><input type="checkbox" id="chkBox"> Show movement box</label>
    <div class="pactions">
      <button id="btnRestart">Restart game</button>
      <button id="btnExit" class="warn">Exit and turn off camera</button>
      <button id="btnClose" class="primary">Back to game</button>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';

/* ======================= CONFIG ======================= */
const ROUNDS = 10;
const TAU = Math.PI * 2;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const UI_FONT = 'Fredoka, "Baloo 2", "Arial Rounded MT Bold", "Varela Round", "Comic Sans MS", system-ui, sans-serif';
const PALETTE = ['#FF8FB8', '#FFC46B', '#7FD99A', '#6CC4FF', '#B79CFF', '#FFE066', '#FF9F80', '#7EE0D6'];
const PRAISE = ['Amazing!', 'You did it!', 'Super star!', 'Wow! You froze like a statue!', 'Fantastic!', 'Hooray!', 'So still! Great job!', 'You are a freeze champion!'];
const DANCE_LINES = ['Dance!', 'Wiggle, wiggle!', 'Shake it!', 'Dance, dance, dance!', 'Go, go, go!'];
const SHH_LINES = ['Shhh, freeze like a statue!', 'Shhh! Stay still, like a statue!', 'Shhh, freeze like a statue! Not even a wiggle!'];
const NUMW = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five'];
const DIFF = {
  easy:   { k: 1.5,  holds: [2, 2, 2, 2.5, 2.5, 3, 3, 3.5, 3.5, 4], dance: [4, 7] },
  normal: { k: 1.0,  holds: [2, 2, 2.5, 3, 3, 3.5, 4, 4, 4.5, 5],   dance: [4, 8] },
  hard:   { k: 0.75, holds: [2, 3, 3, 3.5, 4, 4, 4.5, 5, 5, 5],     dance: [4, 8] }
};
const SPRINKLES = [[-0.07, -1.0], [0.08, -0.95], [0, -1.09], [-0.13, -0.78], [0.11, -0.72], [0, -0.87], [0.16, -0.85], [-0.2, -0.5], [0.2, -0.52], [0, -0.69]];

/* ======================= CHIPTUNE LOOP ======================= */
const BPM = 124, STEP_SEC = 60 / BPM / 4, BARS = 8, STEPS = BARS * 16;
const NOTE_NUM = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
// ==MUSIC-START==
function parseMelody(src) {
  const out = new Array(STEPS).fill(null); let i = 0;
  src.replace(/\|/g, ' ').trim().split(/\s+/).forEach(tok => {
    const parts = tok.split(':'), len = parseInt(parts[1], 10) || 2, n = parts[0];
    if (n !== 'R' && i < STEPS) out[i] = { m: NOTE_NUM[n[0]] + 12 * (parseInt(n[1], 10) + 1), len };
    i += len;
  });
  return { notes: out, total: i };
}
const MELODY = parseMelody(
  'E5:2 G5:2 A5:2 G5:2 E5:2 D5:2 C5:2 D5:2 | E5:2 E5:2 D5:2 C5:2 D5:6 R:2 | E5:2 G5:2 A5:2 G5:2 E5:2 D5:2 C5:2 D5:2 | E5:2 D5:2 C5:2 D5:2 C5:6 R:2 | ' +
  'G5:2 G5:2 A5:2 B5:2 C6:4 B5:2 A5:2 | G5:2 E5:2 G5:2 A5:2 G5:6 R:2 | E5:2 G5:2 A5:2 G5:2 E5:2 D5:2 C5:2 D5:2 | E5:2 D5:2 C5:4 C5:2 R:6');
const ROOTS = [48, 43, 45, 48, 43, 48, 41, 48];
// ==MUSIC-END==
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

const Music = {
  on: false, paused: false, step: 0, nextT: 0, timer: 0, startT: 0, gain: null, duck: null, frozenBeat: 0, lastDuck: 1,
  node() {
    const a = audio(); if (!a) return null;
    if (!this.gain) { this.gain = a.createGain(); this.gain.gain.value = 0; this.duck = a.createGain(); this.duck.gain.value = 1; this.gain.connect(this.duck); this.duck.connect(master); }
    return a;
  },
  start(fromStep) {
    const a = this.node(); if (!a) return;
    this.stopTimer(); this.paused = false;
    this.step = fromStep || 0; this.nextT = a.currentTime + 0.06; this.startT = this.nextT - this.step * STEP_SEC; this.on = true;
    const g = this.gain.gain; g.cancelScheduledValues(a.currentTime); g.setValueAtTime(g.value, a.currentTime); g.linearRampToValueAtTime(1, a.currentTime + 0.2);
    this.timer = setInterval(() => this.tick(), 30); this.tick();
  },
  stop() {
    this.stopTimer();
    if (this.on && ac && this.gain) { const g = this.gain.gain; this.frozenBeat = this.beat(); g.cancelScheduledValues(ac.currentTime); g.setValueAtTime(g.value, ac.currentTime); g.linearRampToValueAtTime(0, ac.currentTime + 0.05); }
    this.on = false; this.paused = false;
  },
  pause() { if (!this.on || this.paused) return; this.stopTimer(); this.paused = true; },
  resume() { if (!this.paused) return; this.start(this.step); },
  stopTimer() { clearInterval(this.timer); this.timer = 0; },
  tick() {
    if (!ac || !this.on || this.paused) return;
    let n = 0;
    while (this.nextT < ac.currentTime + 0.16 && n++ < 32) { this.play(this.step, this.nextT); this.step = (this.step + 1) % STEPS; this.nextT += STEP_SEC; }
  },
  beat() { if (!this.on || this.paused || !ac) return this.frozenBeat; return Math.max(0, (ac.currentTime - this.startT) / (STEP_SEC * 4)); },
  setDuck(v) { if (!this.duck || !ac || v === this.lastDuck) return; this.lastDuck = v; this.duck.gain.setTargetAtTime(v, ac.currentTime, 0.08); },
  play(step, t) {
    const bar = Math.floor(step / 16), s = step % 16, n = MELODY.notes[step];
    if (n) this.lead(mtof(n.m), t, n.len * STEP_SEC);
    if (s % 2 === 0) { const r = ROOTS[bar]; this.bass(mtof(s === 12 ? r + 7 : (s % 4 === 0 ? r : r + 12)), t, STEP_SEC * 1.7); }
    if (s === 0 || s === 8 || (bar % 2 === 1 && s === 10)) this.kick(t);
    if (s === 4 || s === 12) this.snare(t);
    if (s % 2 === 0) this.hat(t, s === 14);
  },
  lead(f, t, dur) {
    const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
    o.type = 'square'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.085, t + 0.008); g.gain.exponentialRampToValueAtTime(0.045, t + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
    o.connect(fl); fl.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur);
  },
  bass(f, t, dur) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.17, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur);
  },
  kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + 0.16);
  },
  snare(t) {
    const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = getNoise(); fl.type = 'bandpass'; fl.frequency.value = 1900; fl.Q.value = 0.7;
    g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    src.connect(fl); fl.connect(g); g.connect(this.gain); src.start(t); src.stop(t + 0.11);
    const o = ac.createOscillator(), g2 = ac.createGain(); o.type = 'sine'; o.frequency.value = 185;
    g2.gain.setValueAtTime(0.12, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07); o.connect(g2); g2.connect(this.gain); o.start(t); o.stop(t + 0.08);
  },
  hat(t, open) {
    const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), d = open ? 0.09 : 0.03;
    src.buffer = getNoise(); fl.type = 'highpass'; fl.frequency.value = 7500;
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(this.gain); src.start(t); src.stop(t + d + 0.01);
  }
};

/* ======================= MOTION DETECTOR (frame difference) =======================
   Works on a 96-px-wide copy of the mirrored video. frac = share of pixels that
   changed since the last frame, after removing global brightness drift (auto
   exposure). An activity map (slow EMA of changed pixels) gives a stable box
   around the person, used to place the ice cream and the ice crystals. */
// ==DETECTOR-START==
class MotionDetector {
  constructor(w, h) {
    this.w = w; this.h = h; this.n = w * h;
    this.prev = new Uint8Array(this.n); this.cur = new Uint8Array(this.n); this.act = new Float32Array(this.n);
    this.col = new Float32Array(w); this.row = new Float32Array(h); this.dif = new Uint8Array(this.n); this.hist = new Uint32Array(64); this.noise = 0;
    this.has = false; this.frac = 0; this.flat = false; this.seen = false; this.frames = 0;
    this.cx = 0.5; this.cy = 0.5; this.bw = 0.3; this.bh = 0.6;
  }
  process(data) {
    const n = this.n, w = this.w, h = this.h, cur = this.cur, prev = this.prev, act = this.act;
    let sum = 0, sq = 0;
    for (let i = 0, j = 0; i < n; i++, j += 4) { const y = (data[j] * 77 + data[j + 1] * 151 + data[j + 2] * 28) >> 8; cur[i] = y; sum += y; sq += y * y; }
    const mean = sum / n, std = Math.sqrt(Math.max(0, sq / n - mean * mean));
    this.flat = std < 6;
    if (!this.has) { prev.set(cur); this.has = true; this.frac = 0; return 0; }
    let ds = 0; for (let i = 0; i < n; i++) ds += cur[i] - prev[i];
    const shift = ds / n, dif = this.dif, hist = this.hist; hist.fill(0);
    for (let i = 0; i < n; i++) { let d = cur[i] - prev[i] - shift; if (d < 0) d = -d; if (d > 255) d = 255; dif[i] = d; hist[d > 63 ? 63 : d | 0]++; }
    let acc = 0, med = 0; for (let b = 0; b < 64; b++) { acc += hist[b]; if (acc >= n / 2) { med = b; break; } }

    const kb = camView ? kidBox() : null;
    if (kb && cold) drawKidCrystals(kb, p, time, R.hint && ph === 'freeze');
    if (kb && S.showBox) { ctx.save(); ctx.strokeStyle = '#FF6FA3'; ctx.lineWidth = 3; ctx.strokeRect(kb.x, kb.y, kb.w, kb.h); ctx.restore(); pillText(`motion ${(motion.frac * 100).toFixed(1)}%  freeze limit ${(freezeThr() * 100).toFixed(1)}%`, W / 2, H - insets.b - Math.min(W, H) * 0.06, Math.min(W, H) * 0.03, 'rgba(255,255,255,0.9)', '#2F3B63'); }
    if (S.mode === 'touch') drawTouchGuide(time);
    const face = ph === 'success' ? 'happy' : ice.wob > 0.3 ? 'wob' : cold ? 'focus' : 'smile';
    drawIceCream(ice.x, ice.y, ice.s, time, { face, wob: ice.wob, glow: ice.glow });
    drawGamePenguin(time, dt);
    drawBadge(time);
    drawBursts();
    drawBigNum();
    if (R.stepBack) drawStepBack(time);
  } else if (sc === 'finale') drawFinale(time);
  else { if (sc !== 'start') drawFloaters(time); drawSpotMascot(time); }
  drawParticles();
  drawFlyers();
}
let lastFrame = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (!(dt >= 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  const paused = isPaused();
  try {
    if (!paused) update(dt);
    if (ctx) render(now / 1000, paused ? 0 : dt);
  } catch (e) { console.error(e); }
}

/* ======================= LAYOUT ======================= */
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(probe);
function updateSpot() { const el = document.querySelector('.screen.active .mascot-spot'); spot = el ? el.getBoundingClientRect() : null; }
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.max(0.75, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2.6e6 / (W * H))));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const cs = getComputedStyle(probe);
  insets = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  const mb = $('#btnMute').getBoundingClientRect(); starBottom = Math.max(mb.bottom || 0, insets.t + Math.min(W, H) * 0.09, 48);
  updateSpot(); buildBg(); penguin.init = false; KB.init = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ======================= INPUT ======================= */
document.addEventListener('pointerdown', () => { S.lastInteract = gt; }, true);
$('#btnPlay').addEventListener('click', () => { unlock(); sfx.click(); if (S.prefTouch) goTouch(); else goCamera(false); });
$('#btnTouch').addEventListener('click', () => { unlock(); sfx.click(); goTouch(); });
$('#btnRetry').addEventListener('click', () => { unlock(); sfx.click(); goCamera(false); });
$('#btnAgain').addEventListener('click', () => { unlock(); sfx.click(); if (S.mode === 'touch' || S.prefTouch) goTouch(); else goCamera(false); });
$('#btnSay').addEventListener('click', () => { unlock(); S.lastInteract = gt; if (S.screen === 'game') say(currentInstruction()); else sayScreen(); });
$('#btnMute').addEventListener('click', () => {
  unlock(); S.muted = !S.muted; $('#btnMute').textContent = S.muted ? '🔕' : '🔔';
  if (master) master.gain.value = S.muted ? 0 : 0.55;
  if (S.muted) cancelSpeech(); else sfx.click();
});
let lastPX = 0, lastPY = 0, noteT = 0;
function touchMotion(e, down) {
  if (S.screen !== 'game' || isPaused()) return;
  const dx = e.clientX - lastPX, dy = e.clientY - lastPY; lastPX = e.clientX; lastPY = e.clientY;
  if (!down && Math.hypot(dx, dy) < 2) return;
  S.lastTouchGT = gt;
  if (S.mode !== 'touch') return;
  if (R.phase === 'dance' && gt - noteT > 0.18) { noteT = gt; addEmojiParts(pick(['🎵', '🎶', '✨']), e.clientX, e.clientY, 1, Math.min(W, H) * 0.06, true); }
  if (R.phase === 'freeze' && R.fz && R.fz.grace <= 0 && !R.fz.wob && down) { R.fz.over = 3; onWobble(); }
}
cv.addEventListener('pointerdown', (e) => { unlock(); lastPX = e.clientX; lastPY = e.clientY; touchMotion(e, true); });
cv.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch' || S.mode === 'touch') touchMotion(e, false); });

/* ======================= GROWN-UP CORNER ======================= */
let holdStart = 0, holdRaf = 0;
function holdTick() {
  const p = (performance.now() - holdStart) / 3000;
  grown.style.setProperty('--p', Math.min(1, p).toFixed(3));
  if (p >= 1) { endHold(); openPanel(); } else holdRaf = requestAnimationFrame(holdTick);
}
function endHold() { cancelAnimationFrame(holdRaf); grown.classList.remove('holding'); grown.style.setProperty('--p', '0'); }
grown.addEventListener('pointerdown', (e) => {
  e.preventDefault(); try { grown.setPointerCapture(e.pointerId); } catch (_) {}
  holdStart = performance.now(); grown.classList.add('holding'); cancelAnimationFrame(holdRaf); holdRaf = requestAnimationFrame(holdTick);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => grown.addEventListener(ev, endHold));
grown.addEventListener('contextmenu', (e) => e.preventDefault());

function addOpt(sel, v, label) { const o = document.createElement('option'); o.value = v; o.textContent = label; sel.appendChild(o); }
async function fillDevices() {
  const selCam = $('#selCam'), selMic = $('#selMic');
  let devs = [];
  try { if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) devs = await navigator.mediaDevices.enumerateDevices(); } catch (e) {}
  selCam.innerHTML = ''; addOpt(selCam, '', 'Front camera (default)');
  devs.filter(d => d.kind === 'videoinput').forEach((d, i) => { if (d.deviceId) addOpt(selCam, d.deviceId, d.label || 'Camera ' + (i + 1)); });
  selCam.value = S.camId; if (selCam.value !== S.camId) selCam.value = '';
  selMic.innerHTML = ''; addOpt(selMic, '', 'Off');
  let any = false;
  devs.filter(d => d.kind === 'audioinput').forEach((d, i) => { if (d.deviceId && d.deviceId !== 'default' && d.deviceId !== 'communications') { addOpt(selMic, d.deviceId, d.label || 'Microphone ' + (i + 1)); any = true; } });
  if (!any) addOpt(selMic, 'any', 'Microphone');
  selMic.value = S.micId; if (selMic.value !== S.micId) selMic.value = '';
}
function syncPanel() {
  document.querySelectorAll('#segDiff button').forEach(b => b.classList.toggle('on', b.dataset.v === S.diff));
  $('#chkTouch').checked = S.mode === 'touch' || S.prefTouch; $('#chkBox').checked = S.showBox;
}
function openPanel() {
  S.panel = true; panel.classList.add('open'); cancelSpeech(); Music.pause();
  if (ac && ac.state === 'running') ac.suspend().catch(() => {});
  syncPanel(); fillDevices();
  setTimeout(() => $('#btnClose').focus(), 50);
}
function afterPause() {
  lastFrame = performance.now();
  if (ac && !S.hidden && !S.panel) ac.resume().catch(() => {});
  if (S.screen !== 'game') return;
  if (R.phase === 'dance') Music.resume();
  if (R.phase === 'freeze' && R.fz) { R.fz.grace = Math.max(R.fz.grace, 1); R.fz.over = 0; }
  if (R.phase === 'dance' || R.phase === 'freeze') setTimeout(() => say(currentInstruction()), 300);
}
function closePanel() { S.panel = false; panel.classList.remove('open'); afterPause(); }
$('#segDiff').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; setDifficulty(b.dataset.v); syncPanel(); });
$('#selCam').addEventListener('change', async (e) => {
  S.camId = e.target.value; $('#camNote').textContent = '';
  if (S.mode === 'camera' && stream) {
    try { await startCamera(S.run); KB.init = false; }
    catch (err) { $('#camNote').textContent = 'That camera could not start. Pick another one or use touch mode.'; }
  }
});
$('#selMic').addEventListener('change', async (e) => {
  const v = e.target.value; S.micId = v; const note = $('#micNote');
  if (!v) { stopMic(); note.textContent = ''; return; }
  try { await startMic(v); note.textContent = 'Microphone on. Singing along while dancing makes music notes appear 🎵'; fillDevices(); }
  catch (err) { S.micId = ''; e.target.value = ''; note.textContent = 'The microphone is blocked or missing. That is fine, the game works without it.'; }
});
$('#chkTouch').addEventListener('change', (e) => {
  S.prefTouch = e.target.checked;
  if (e.target.checked) {
    if (S.mode !== 'touch') { S.run++; S.mode = 'touch'; stopCamera(); KB.init = false; if (S.screen === 'perm') { S.panel = false; panel.classList.remove('open'); goTouch(); } }
  } else if (S.mode === 'touch' && S.screen === 'game') { S.panel = false; panel.classList.remove('open'); goCamera(true); }
  else if (S.mode === 'touch') S.mode = 'camera';
});
$('#chkBox').addEventListener('change', (e) => { S.showBox = e.target.checked; });
$('#btnRestart').addEventListener('click', () => {
  S.panel = false; panel.classList.remove('open'); if (ac) ac.resume().catch(() => {});
  if (S.mode === 'touch' || S.prefTouch) goTouch(); else if (stream) startGame(); else goCamera(false);
});
$('#btnExit').addEventListener('click', exitToStart);
$('#btnClose').addEventListener('click', closePanel);
panel.addEventListener('click', (e) => { if (e.target === panel) closePanel(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.panel) closePanel(); });

/* ======================= VISIBILITY + CLEANUP ======================= */
let hideTimer = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    S.hidden = true; cancelSpeech(); Music.pause();
    if (ac && ac.state === 'running') ac.suspend().catch(() => {});
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { if (S.hidden && stream) { stopCamera(); S.camSuspended = true; } }, 60000);
  } else {
    S.hidden = false; clearTimeout(hideTimer);
    if (S.camSuspended) {
      S.camSuspended = false;
      if (S.mode === 'camera' && (S.screen === 'game' || S.screen === 'finale')) startCamera(S.run).catch(() => cameraLost());
    }
    afterPause();
  }
});
window.addEventListener('pagehide', () => { Music.stop(); stopCamera(); stopMic(); cancelSpeech(); });
window.addEventListener('beforeunload', () => { stopCamera(); stopMic(); });

/* ======================= START ======================= */
resize();
if (document.fonts && document.fonts.load) document.fonts.load('700 40px Fredoka').catch(() => {});
requestAnimationFrame(frame);
if (location.hash === '#debug') window.__FD = { S, R, motion, Music };
})();
</script>
