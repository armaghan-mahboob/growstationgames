<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Maze Mouse Moonlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#ffd86b;--cream:#f6efc8;--ink:#3d2a02;
  --glass-b:rgba(255,255,255,.14);
  --pk:clamp(44px,min(13vw,7.5vh),62px);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--cream);background:#0b1030;font-size:15px;line-height:1.4;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Night sky ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(900px 600px at 100% 0%,rgba(255,224,140,.16),transparent 62%),
    radial-gradient(800px 600px at 0% 100%,rgba(122,92,230,.28),transparent 60%),
    radial-gradient(700px 500px at 50% 50%,rgba(60,80,190,.18),transparent 70%),
    linear-gradient(160deg,#0a0e2c 0%,#131a4a 55%,#1c1f5a 100%)}
.sky::before,.sky::after{content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 120px,#f6efc8,transparent),
    radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),
    radial-gradient(1px 1px at 240px 180px,#cfd6ff,transparent),
    radial-gradient(2px 2px at 300px 90px,#fff,transparent),
    radial-gradient(1px 1px at 60px 220px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 210px 260px,#f6efc8,transparent);
  background-size:340px 300px;opacity:.8;animation:tw 4.5s ease-in-out infinite alternate}
.sky::after{background-size:470px 410px;background-position:120px 80px;animation-delay:-2.2s;animation-duration:6s}
@keyframes tw{from{opacity:.3}to{opacity:.95}}
.moon{position:absolute;right:-2vmin;top:-2vmin;width:clamp(90px,20vmin,200px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe0,#f6e3a1 55%,#dfc06c);opacity:.55;
  box-shadow:0 0 50px 18px rgba(255,226,140,.22),0 0 160px 60px rgba(255,226,140,.10)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(160,130,50,.22)}
.moon::before{width:22%;height:22%;left:24%;top:30%}
.moon::after{width:14%;height:14%;left:58%;top:56%}

/* ---------- App frame (never scrolls) ---------- */
.mm{position:relative;z-index:1;width:100%;max-width:1500px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid var(--glass-b);border-radius:20px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(4,6,30,.35),inset 0 1px 0 rgba(255,255,255,.12)}

/* ---------- Header ---------- */
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand-ic{flex:0 0 auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:23px;color:var(--ink);
  background:linear-gradient(160deg,#ffe9a8,#f2b838);box-shadow:0 0 22px rgba(255,216,107,.45)}
.brand-tx{line-height:1.05;min-width:0}
.brand-tx b{display:block;font-size:clamp(17px,2.2vw,23px);font-weight:700;white-space:nowrap;
  background:linear-gradient(180deg,#fff6cf,#ffd86b);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-tx small{display:block;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:#aab2e8;margin-top:2px}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.chip i{color:var(--gold);font-size:18px}
.acts{display:flex;gap:8px}

/* ---------- Buttons ---------- */
.btn{font:inherit;font-weight:500;font-size:15px;min-height:42px;padding:0 16px;border-radius:14px;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:var(--cream);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;
  transition:transform .12s,background .2s,box-shadow .2s}
.btn i{font-size:19px}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.95)}
.btn:focus-visible,.pad button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.pri{background:linear-gradient(180deg,#ffe28a,#f2b838);color:var(--ink);border-color:#ffe9a8;font-weight:600;
  box-shadow:0 6px 18px rgba(255,200,70,.35)}
.btn.pri:hover{background:linear-gradient(180deg,#fff0b0,#f7c850)}
.btn[hidden]{display:none!important}

/* ---------- Board ---------- */
.main{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:10px}
.board{position:relative;flex:1 1 0;min-height:0;min-width:0}
.stage{position:absolute;inset:0;margin:auto;overflow:hidden;background:#0d1336;container-type:size;
  border-radius:clamp(14px,2.6vmin,28px);
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 0 6px rgba(255,255,255,.045),0 20px 60px rgba(4,6,30,.6),0 0 90px rgba(120,130,255,.20)}
.stage canvas{display:block}

/* ---------- Overlays ---------- */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:clamp(6px,2.4cqmin,16px);padding:4cqmin;
  background:radial-gradient(circle at 50% 40%,rgba(34,44,116,.80),rgba(8,11,34,.92));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov.soft{background:linear-gradient(180deg,rgba(8,11,34,.62),rgba(8,11,34,0) 75%);-webkit-backdrop-filter:none;backdrop-filter:none;
  justify-content:flex-start;padding-top:3.5cqmin}
.ov h3{font-size:clamp(20px,7cqmin,46px);font-weight:700;line-height:1.1;
  background:linear-gradient(180deg,#fff6cf,#ffd86b);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{font-size:clamp(13px,3.6cqmin,19px);color:#d9dcf0;max-width:34em}
.ov p.note{color:var(--gold)}
.ov-ic{width:clamp(44px,13cqmin,78px);height:clamp(44px,13cqmin,78px);border-radius:50%;display:grid;place-items:center;
  font-size:clamp(24px,7.5cqmin,44px);color:var(--ink);background:linear-gradient(160deg,#ffe9a8,#f2b838);
  box-shadow:0 0 40px rgba(255,216,107,.5);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.ov-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ov .btn{min-height:clamp(40px,10cqmin,56px);font-size:clamp(14px,3.8cqmin,19px);padding:0 clamp(14px,4cqmin,26px);border-radius:16px}
.ov .big{font-size:clamp(34px,13cqmin,72px);font-weight:700;color:var(--gold);width:1.7em;height:1.7em;line-height:1;
  display:grid;place-items:center;border-radius:50%;border:3px solid rgba(255,216,107,.5);
  box-shadow:0 0 30px rgba(255,216,107,.3),inset 0 0 20px rgba(255,216,107,.12)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Control dock ---------- */
.dock{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 14px}
.cam-col{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%;max-width:240px;justify-self:center}
.cam{position:relative;width:min(100%,calc(25vh*4/3));aspect-ratio:4/3;margin:0 auto;border-radius:14px;overflow:hidden;
  background:linear-gradient(160deg,#151c52,#0d1336);border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 0 20px rgba(0,0,0,.35)}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.cam video{object-fit:cover}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8f98d6;font-size:12.5px}
.camoff i{font-size:24px}
.stat{display:flex;align-items:center;gap:8px;min-height:40px}
#mmMeter{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14)}
#mmStatus{font-size:12.5px;line-height:1.25;color:#c9cdf0}
.mode-row{display:flex;gap:6px;width:100%}
.mode-row .btn{flex:1 1 0;min-height:40px;font-size:13px;padding:0 10px;gap:6px;min-width:0}
.mode-row .btn i{font-size:17px}
#mmCal{flex:0 0 40px;padding:0}

.pad{display:grid;grid-template-columns:repeat(3,var(--pk));grid-template-rows:repeat(3,var(--pk));gap:6px;justify-content:center;justify-self:center}
.pad button{width:var(--pk);height:var(--pk);padding:0;border-radius:calc(var(--pk)*.32);font:inherit;font-size:calc(var(--pk)*.5);
  display:grid;place-items:center;color:var(--cream);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);
  box-shadow:0 5px 0 rgba(4,6,30,.5),0 8px 16px rgba(4,6,30,.3);transition:transform .08s,box-shadow .08s,background .15s}
.pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(4,6,30,.5)}
.pad button.on{background:linear-gradient(180deg,#ffe28a,#f2b838);color:var(--ink);border-color:#ffe9a8;
  box-shadow:0 2px 0 rgba(120,80,0,.6),0 0 22px rgba(255,200,70,.5)}
.pad .ctr{border-radius:50%;transform:scale(.4);background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.2)}

/* ---------- Layout variants ---------- */
@media (orientation:landscape) and (min-width:640px){
  .main{flex-direction:row}
  .dock{flex:0 0 clamp(210px,26vw,310px);width:clamp(210px,26vw,310px);grid-template-columns:minmax(0,1fr);
    justify-items:center;align-content:center;gap:clamp(6px,1.5vh,14px);--pk:clamp(40px,8.4vh,62px)}
  .cam-col{max-width:none}
}
@media (orientation:landscape) and (max-height:520px){
  .mm{gap:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .main{gap:6px}
  .dock{flex-basis:clamp(280px,44vw,400px);width:clamp(280px,44vw,400px);grid-template-columns:minmax(0,1fr) auto;
    --pk:clamp(38px,12vh,52px);padding:8px 10px;gap:10px}
  .cam-col{max-width:190px}
  .hdr{padding:5px 8px}
  .brand-ic{width:34px;height:34px;font-size:20px}
  .brand-tx small{display:none}
}
@media (max-width:560px){
  .brand-tx{display:none}
  .hdr{gap:8px;padding:7px 8px}
  .chip{padding:5px 10px;font-size:13px}
  .hdr .btn{width:42px;padding:0}
  .hdr .lbl{display:none}
}
@media (max-width:360px){.brand-ic{display:none}}
@media (prefers-reduced-motion:reduce){.sky::before,.sky::after,.ov-ic,.spin{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="moon"></div></div>

<div class="mm" id="mmRoot">
  <h2 class="sr-only">Maze Mouse Moonlight, a webcam maze game where a young child leans left, right, forward, or back to guide a mouse home, with arrow buttons as a backup.</h2>

  <header class="hdr glass">
    <div class="brand">
      <span class="brand-ic"><i class="ti ti-moon-stars" aria-hidden="true"></i></span>
      <div class="brand-tx"><b>Maze Mouse</b><small>Moonlight</small></div>
    </div>
    <div class="chips">
      <span class="chip" title="Maze"><i class="ti ti-map-2" aria-hidden="true"></i><span id="mmLvl">Maze 1/3</span></span>
      <span class="chip" title="Cheese collected"><i class="ti ti-cheese" aria-hidden="true"></i><span id="mmChs">0/3</span></span>
    </div>
    <div class="acts">
      <button class="btn pri" id="mmStart" aria-label="Start"><i class="ti ti-player-play" aria-hidden="true"></i><span class="lbl">Start</span></button>
      <button class="btn" id="mmPause" aria-label="Pause" hidden><i class="ti ti-player-pause" aria-hidden="true"></i><span class="lbl">Pause</span></button>
      <button class="btn pri" id="mmResume" aria-label="Resume" hidden><i class="ti ti-player-play" aria-hidden="true"></i><span class="lbl">Resume</span></button>
      <button class="btn" id="mmRestart" aria-label="Restart"><i class="ti ti-refresh" aria-hidden="true"></i><span class="lbl">Restart</span></button>
    </div>
  </header>

  <main class="main">
    <section class="board" id="mmBoard">
      <div class="stage" id="mmStage">
        <canvas id="mmCanvas"></canvas>
        <div id="mmOv" class="ov"></div>
      </div>
    </section>

    <aside class="dock glass">
      <div class="cam-col">
        <div class="cam">
          <video id="mmVid" playsinline muted autoplay></video>
          <canvas id="mmCamCv" width="320" height="240"></canvas>
          <div class="camoff" id="mmCamOff"><i class="ti ti-camera-off" aria-hidden="true"></i>Camera off</div>
        </div>
        <div class="stat">
          <canvas id="mmMeter" width="120" height="120"></canvas>
          <span id="mmStatus">Arrow keys or the big arrows move the mouse.</span>
        </div>
        <div class="mode-row">
          <button class="btn" id="mmMode"><i class="ti ti-camera" aria-hidden="true"></i><span class="lbl">Use camera</span></button>
          <button class="btn" id="mmCal" hidden title="Calibrate" aria-label="Calibrate"><i class="ti ti-target" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="pad" id="mmPad">
        <span></span><button data-d="up" aria-label="Forward"><i class="ti ti-arrow-up" aria-hidden="true"></i></button><span></span>
        <button data-d="left" aria-label="Left"><i class="ti ti-arrow-left" aria-hidden="true"></i></button><span class="ctr"></span><button data-d="right" aria-label="Right"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
        <span></span><button data-d="down" aria-label="Back"><i class="ti ti-arrow-down" aria-hidden="true"></i></button><span></span>
      </div>
    </aside>
  </main>

  <div id="mmTests" hidden></div>
</div>

<script>
(function(){
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const LABEL={up:'forward',down:'back',left:'left',right:'right'};
const TX=.35,TZ=.4,EX=.22,EZ=.26;
const MAPS=[
{name:'Little garden',map:['#########','#S..C...#','#.#####.#','#.#C....#','#.#.#####','#...C..H#','#########']},
{name:'Moon meadow',map:['###########','#S...#..C.#','#.##.#.##.#','#.#C...#..#','#.#.####.##','#...#C...H#','###########']},
{name:'Starry woods',map:['#############','#S..#...#..C#','##.##.#.#.#.#','#C....#...#.#','#.###.###.#.#','#...#..C#...#','###.###.#.###','#C....#....H#','#############']},
{name:'Firefly hollow',map:['###############', '#S..#......C#.#', '#.#.###.#####.#', '#.#.......#...#', '#.###.#####.#.#', '#...#C#.....#.#', '###.###.#.#.#.#', '#C....#.#.#.#H#', '###.###.#.#####', '#.......#....C#', '###############']},
{name:'Midnight castle',map:['###############', '#S#...#.#...#C#', '#.#.#.#.#.#.#.#', '#...#.#...#...#', '#.###.###.###.#', '#..C#.#.#...#.#', '#.###.#.#.###.#', '#...#...#..C#.#', '#.#.#.#.#.###.#', '#.#.#.#.....#.#', '#.###.###.#.#.#', '#..C#...#C#.#H#', '###############']}
];
function parseMaze(rows){
const m={rows:rows,w:rows[0].length,h:rows.length,cheese:[],start:null,home:null};
rows.forEach(function(row,r){for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='S')m.start={c:c,r:r};else if(ch==='H')m.home={c:c,r:r};else if(ch==='C')m.cheese.push({c:c,r:r})}});
m.open=function(c,r){return r>=0&&r<m.h&&c>=0&&c<m.w&&rows[r][c]!=='#'};
return m}
function bfs(m,from){
const dist=Array.from({length:m.h},function(){return Array(m.w).fill(Infinity)});
const q=[from];dist[from.r][from.c]=0;
while(q.length){const p=q.shift();for(const k in DIRS){const c=p.c+DIRS[k][0],r=p.r+DIRS[k][1];if(m.open(c,r)&&dist[r][c]===Infinity){dist[r][c]=dist[p.r][p.c]+1;q.push({c:c,r:r})}}}
return dist}
class Game{
constructor(levels,opts){this.levels=levels;this.opts=Object.assign({stepTime:.55,assist:true,hintAfter:9},opts||{});this.reset(0)}
reset(i){
this.levelIndex=i;const mz=this.maze=parseMaze(this.levels[i].map);
this.homeDist=bfs(mz,mz.home);const s=mz.start;
this.mouse={c:s.c,r:s.r,tc:s.c,tr:s.r,t:0,moving:false,dir:'right',face:1,bump:0,bumpDir:null,lastWant:null};
this.cheese=mz.cheese.map(function(p){return {c:p.c,r:p.r,got:false}});
this.score=0;this.done=false;this.doneTime=0;this.idle=0;this.hint=null;this.effects=[];this.events=[];this.time=0;
this.bestDist=this.homeDist[s.r][s.c]}
get total(){return this.cheese.length}
pathHome(){
const m=this.mouse,d=this.homeDist,mz=this.maze;let c=m.c,r=m.r;const p=[];let guard=0;
while(d[r][c]>0&&guard++<300){let nx=null;for(const k in DIRS){const cc=c+DIRS[k][0],rr=r+DIRS[k][1];if(mz.open(cc,rr)&&d[rr][cc]===d[r][c]-1){nx=[cc,rr];break}}if(!nx)break;c=nx[0];r=nx[1];p.push({c:c,r:r})}
return p}
tryMove(d){
const m=this.mouse,mz=this.maze,v=DIRS[d];let go=null;
if(mz.open(m.c+v[0],m.r+v[1]))go=d;
else if(this.opts.assist&&m.lastWant===d){
const skip=[d,OPP[d],OPP[m.dir]];
const side=Object.keys(DIRS).filter(function(k){return skip.indexOf(k)<0&&mz.open(m.c+DIRS[k][0],m.r+DIRS[k][1])});
if(side.length===1)go=side[0]}
if(!go){if(m.bump<=0){m.bump=.35;m.bumpDir=d;this.events.push('bump')}if(v[0])m.face=v[0];return false}
const g=DIRS[go];m.tc=m.c+g[0];m.tr=m.r+g[1];m.t=0;m.moving=true;m.dir=go;m.lastWant=d;if(g[0])m.face=g[0];return true}
update(dt,dir){
this.time+=dt;this.tickFx(dt);
if(this.done){this.doneTime+=dt;return}
const m=this.mouse;
if(m.bump>0)m.bump=Math.max(0,m.bump-dt);
if(m.moving){m.t+=dt/this.opts.stepTime;if(m.t>=1){m.c=m.tc;m.r=m.tr;m.t=0;m.moving=false;this.arrive();if(this.done)return}}
if(!dir)m.lastWant=null;else if(!m.moving)this.tryMove(dir);
this.idle+=dt;
if(!this.hint&&this.idle>=this.opts.hintAfter){this.hint=this.pathHome();this.events.push('hint')}}
arrive(){
const m=this.mouse,h=this.maze.home;
for(const ch of this.cheese){if(!ch.got&&ch.c===m.c&&ch.r===m.r){ch.got=true;this.score++;this.events.push('cheese');this.burst(m.c+.5,m.r+.5,12);this.effects.push({type:'text',x:m.c+.5,y:m.r+.1,vx:0,vy:-.6,life:0,max:1,text:'+1'});this.idle=0;this.hint=null}}
const d=this.homeDist[m.r][m.c];
if(d<this.bestDist){this.bestDist=d;this.idle=0;this.hint=null}else if(this.hint)this.hint=this.pathHome();
if(m.c===h.c&&m.r===h.r){this.done=true;this.hint=null;this.events.push('win');this.confetti(h,46)}}
burst(x,y,n){const cols=['#ffd34d','#ffe9a8','#f6efc8'];for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=1+Math.random()*1.6;this.effects.push({type:'spark',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:.6+Math.random()*.4,color:cols[i%3]})}}

function runTests(){

const TMAP=[{name:'t',map:['#######','#S.C.H#','###.###','###.###','#######']}];
const ST=.551;const hold=function(g,d,n){for(let i=0;i<=n;i++)g.update(ST,i===n?null:d)};
T('Every maze is valid and all cheese and home are reachable',function(){return MAPS.every(function(L){const m=parseMaze(L.map);const d=bfs(m,m.start);return m.home&&m.cheese.length>0&&L.map.every(function(row){return row.length===m.w})&&isFinite(d[m.home.r][m.home.c])&&m.cheese.every(function(p){return isFinite(d[p.r][p.c])})})});
T('Mouse stops at walls',function(){const g=new Game(TMAP,{assist:false});hold(g,'up',1);hold(g,'left',1);return g.mouse.c===1&&g.mouse.r===1&&!g.mouse.moving&&g.events.indexOf('bump')>=0});
T('Mouse walks along an open path',function(){const g=new Game(TMAP,{assist:false});hold(g,'right',1);return g.mouse.c===2&&g.mouse.r===1});
T('Intersection: down and right lead to different cells',function(){const a=new Game(TMAP,{assist:false});hold(a,'right',2);hold(a,'down',2);const b=new Game(TMAP,{assist:false});hold(b,'right',3);return a.mouse.c===3&&a.mouse.r===3&&b.mouse.c===4&&b.mouse.r===1});

T('Cheese counts only once',function(){const g=new Game(TMAP,{assist:false});hold(g,'right',2);hold(g,'left',1);hold(g,'right',1);return g.score===1&&g.cheese.filter(function(c){return c.got}).length===1&&g.events.filter(function(e){return e==='cheese'}).length===1});
T('Reaching home completes the maze once and freezes the mouse',function(){const g=new Game(TMAP,{assist:false});hold(g,'right',4);const ok=g.done&&g.events.filter(function(e){return e==='win'}).length===1;hold(g,'left',2);return ok&&g.mouse.c===5&&g.mouse.r===1});
